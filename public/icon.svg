  </defs>
  <rect width="512" height="512" rx="112" fill="url(#feltBg)" />
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#D4AF37" stroke-opacity="0.28" stroke-width="6" />
